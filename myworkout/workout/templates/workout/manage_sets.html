<h2> {{workout_exercise.workout.name }}</h2>


<form method="post">
    {% csrf_token %}
    {{ formset.management_form }} 

    <table>
        <tr>
            <th>Weight</th>
            <th>Reps</th>
            <!-- <th>Delete</th> -->
        </tr>

        {% for form in formset %}
            <tr>
                <td>{{ form.weight }}</td>
                <td>{{ form.reps }}</td>
                <!-- <td>{{ form.DELETE }}</td> -->
            </tr>
        {% endfor %}
    </table>
    <button type="submit" href="{% url 'workout_detail' workout_exercise.workout.pk %}">Save </button>
    <!-- <button type="submit">Save Changes</button> -->
</form>
